<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
</head>
<body>

<h1>Edit Post</h1>

<form id="post-form">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>
    <br><br>

    <label for="content">Content:</label>
    <textarea id="content" name="content" rows="10" cols="50" required></textarea>
    <br><br>

    <button type="submit">Save Changes</button>
</form>

<p id="message"></p>
<p><a href="posts.html">Back to Posts</a></p>

<script>
    const contextPath = window.location.pathname.substring(
        0,
        window.location.pathname.indexOf("/", 1)
    );

    const basePath = contextPath || "";
    const postId = new URLSearchParams(window.location.search).get("id");

    async function loadPost() {
        const message = document.getElementById("message");

        if (!postId) {
            message.textContent = "Post ID is missing.";
            document.getElementById("post-form").hidden = true;
            return;
        }

        try {
            const response = await fetch(
                basePath + "/post?id=" + encodeURIComponent(postId),
                { credentials: "same-origin" }
            );

            if (!response.ok) {
                throw new Error("Failed to load post.");
            }

            const post = await response.json();

            document.getElementById("title").value = post.title || "";
            document.getElementById("content").value = post.content || "";
        } catch (error) {
            message.textContent = "Failed to load post.";
        }
    }

    document.getElementById("post-form").addEventListener("submit", async event => {
        event.preventDefault();

        const message = document.getElementById("message");

        const data = {
            title: document.getElementById("title").value.trim(),
            content: document.getElementById("content").value.trim()
        };

        try {
            const response = await fetch(
                basePath + "/posts/update?id=" + encodeURIComponent(postId),
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json().catch(() => ({}));

            if (response.ok) {
                window.location.href =
                    "post.html?id=" + encodeURIComponent(postId);
            } else {
                message.textContent = result.message || "Failed to update post.";
            }
        } catch (error) {
            message.textContent = "Could not connect to the server.";
        }
    });

    loadPost();
</script>

</body>
</html>
